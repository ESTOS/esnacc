# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build and Test (Ubuntu)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Run JavaScript actions (e.g. pnpm/action-setup) on Node 26 instead of deprecated Node 20/24 runtimes.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true
  # GitHub tarball deps (uclogger/ucconfig) invoke npm install with legacy engine ranges.
  NPM_CONFIG_ENGINE_STRICT: "false"

jobs:
  build-and-test:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # package.json declares packageManager: pnpm@11.9.0; setup-node needs pnpm on PATH first.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: pnpm

      - name: Install root pnpm workspace
        run: pnpm install --frozen-lockfile

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTING=ON -DSNACC_CTEST_REGISTER_TS=ON

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Build TypeScript integration tests
        run: cmake --build ${{github.workspace}}/build --target snacc-ts-all

      - name: Run tests (ctest)
        working-directory: ${{github.workspace}}/build
        env:
          SNACC_TS_VERBOSE: "1"
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: |
          ctest --output-on-failure -C ${{env.BUILD_TYPE}} -E typescript_run_ts_microservice
          ctest --output-on-failure -C ${{env.BUILD_TYPE}} -R typescript_run_ts_microservice -V
